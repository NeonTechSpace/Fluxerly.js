name: Docs preview
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: docs-preview
  cancel-in-progress: false
  queue: max
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: website
      url: ${{ vars.CLOUDFLARE_PREVIEW_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup
        id: setup
      - name: Read verified release snapshots
        id: snapshots
        run: node web/scripts/fetch-releases.js
        working-directory: projects
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the SDK declarations for documentation
        id: build
        run: pnpm --filter @neontechspace/fluxerly build
        working-directory: projects
      - name: Build and check the full Preview documentation inventory
        id: workspace
        run: pnpm --filter fluxerly-docs check:public
        working-directory: projects
      - name: Require successful Check for the exact checkout
        id: ci
        run: node web/scripts/checked-source.js
        working-directory: projects
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record the checked source
        id: source
        shell: bash
        run: |
          source="$(git rev-parse HEAD)"
          if [ "$source" != "$CHECKED_SOURCE" ]; then
            printf 'Checkout changed after CI verification\n' >&2
            exit 1
          fi
          printf 'DOCS_SOURCE_COMMIT=%s\n' "$source" >> "$GITHUB_ENV"
          printf '{"sourceCommit":"%s"}\n' "$source" > projects/web/dist/deployment.json
        env:
          CHECKED_SOURCE: ${{ steps.ci.outputs.source_commit }}
      - name: Deploy and verify Preview only
        id: deploy
        run: node scripts/preview-deploy.js
        working-directory: projects/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_PREVIEW_URL: ${{ vars.CLOUDFLARE_PREVIEW_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Summarize Preview delivery
        if: always()
        shell: bash
        env:
          SUMMARY_KIND: preview
          SUMMARY_STEPS: ${{ toJSON(steps) }}
          SUMMARY_DETAILS: >-
            {"sourceCommit": ${{ toJSON(env.DOCS_SOURCE_COMMIT) }}, "previewUrl": ${{ toJSON(vars.CLOUDFLARE_PREVIEW_URL) }}}
        run: |
          if [ -f .github/scripts/workflow-summary.mjs ]; then
            node .github/scripts/workflow-summary.mjs
          else
            printf '## Workflow summary unavailable\n\nCheckout did not provide the summary helper. Inspect the checkout and setup logs, no downstream checks are confirmed\n' >> "$GITHUB_STEP_SUMMARY"
          fi
