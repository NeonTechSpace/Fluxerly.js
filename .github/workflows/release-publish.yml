name: Release publish
on:
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: Successful Release prepare run ID from this repository
        required: true
        type: string
      candidate_checksum:
        description: Externally reviewed candidate.json SHA256 from the preparation summary
        required: true
        type: string
permissions:
  contents: read
  actions: read
cache-mode: read
# Every job checks out this workflow's own commit, so release tooling never runs from the candidate source.
# The candidate commit is data: It must be reachable from main and becomes the GitHub tag target
jobs:
  inspect:
    name: Inspect the reviewed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.preparation.outputs.artifactId }}
      source_commit: ${{ steps.preparation.outputs.sourceCommit }}
      version: ${{ steps.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Verify successful preparation and a candidate source reachable from main
        id: preparation
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
        run: node projects/release/github.js preparation
      - name: Download only the verified preparation candidate
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.preparation.outputs.artifactId }}
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
      - name: Inspect exact candidate contents before entering the protected environment
        id: inspect
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
          CANDIDATE_SOURCE_COMMIT: ${{ steps.preparation.outputs.sourceCommit }}
        run: node projects/release/github.js inspect
      - name: Summarize candidate inspection
        if: always()
        uses: $/.github/actions/summary
        with:
          title: Release provenance and candidate inspection
          steps: ${{ toJSON(steps) }}
          details: >-
            {"Preparation run ID": ${{ toJSON(inputs.preparation_run_id) }}, "Reviewed checksum input": ${{ toJSON(inputs.candidate_checksum) }}, "Candidate source": ${{ toJSON(steps.preparation.outputs.sourceCommit) }}, "Candidate version": ${{ toJSON(steps.inspect.outputs.version) }}, "Candidate artifact ID": ${{ toJSON(steps.preparation.outputs.artifactId) }}}
          next: Protected publication proceeds only after this inspection succeeds
  publish:
    name: Publish npm version
    needs: inspect
    concurrency:
      group: package-release-publish-npm
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: package
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      # Publishing a prebuilt tarball needs Node and pnpm, not the workspace dependencies
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Download only the inspected preparation candidate
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.inspect.outputs.artifact_id }}
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
      - name: Reinspect the externally reviewed candidate
        id: inspect
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.inspect.outputs.source_commit }}
        run: node projects/release/github.js inspect
      - name: Publish the npm version, or confirm the reviewed bytes are already published
        id: publish
        working-directory: projects
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
        run: node release/cli.js publish "$CANDIDATE_DIRECTORY" --checksum "$CANDIDATE_CHECKSUM"
      - name: Summarize npm publication
        if: always()
        uses: $/.github/actions/summary
        with:
          title: npm version publication
          steps: ${{ toJSON(steps) }}
          details: >-
            {"Candidate version": ${{ toJSON(needs.inspect.outputs.version) }}, "Candidate source": ${{ toJSON(needs.inspect.outputs.source_commit) }}, "Reviewed checksum input": ${{ toJSON(inputs.candidate_checksum) }}}
          next: The registry install checks run next. Rerun this workflow with the same inputs after any failure, publication reads npm before uploading
  smoke:
    name: ${{ matrix.name }}
    needs: [inspect, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Registry install on the development Node version
          - name: Registry install on the declared Node floor
            runtime: node@24.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        id: setup
        with:
          working-directory: projects
          require-lockfile: true
          cache: true
          runtime: ${{ matrix.runtime }}
      - name: Install the published version from npm and import every public entry point
        id: smoke
        working-directory: projects
        env:
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
        run: node release/smoke.js --version "$RELEASE_VERSION"
      - name: Summarize the registry install check
        if: always()
        uses: $/.github/actions/summary
        with:
          title: ${{ matrix.name }}
          steps: ${{ toJSON(steps) }}
          details: '{"Package version": ${{ toJSON(needs.inspect.outputs.version) }}, "Node version": ${{ toJSON(matrix.runtime || ''projects/.node-version'') }}}'
          next: Both registry install checks must pass before the GitHub release is announced
  reconcile:
    name: Announce the GitHub release
    needs: [inspect, publish, smoke]
    concurrency:
      group: package-release-reconcile
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: package
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Download only the inspected preparation candidate
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.inspect.outputs.artifact_id }}
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
      - name: Reinspect the externally reviewed candidate before announcement
        id: inspect
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.inspect.outputs.source_commit }}
        run: node projects/release/github.js inspect
      - name: Confirm npm serves the reviewed tarball before requesting the release token
        id: verify
        working-directory: projects
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
        run: node release/cli.js verify "$CANDIDATE_DIRECTORY" --checksum "$CANDIDATE_CHECKSUM"
      - name: Create the repository-scoped release App token
        id: release_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Announce the exact-source GitHub release
        id: announce
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.inspect.outputs.source_commit }}
        run: node projects/release/github.js announce
      - name: Summarize the GitHub release
        if: always()
        uses: $/.github/actions/summary
        with:
          title: GitHub release reconciliation
          steps: ${{ toJSON(steps) }}
          details: >-
            {"Candidate version": ${{ toJSON(needs.inspect.outputs.version) }}, "Tag target": ${{ toJSON(needs.inspect.outputs.source_commit) }}, "Preparation run ID": ${{ toJSON(inputs.preparation_run_id) }}}
          next: Docs preview runs next. Registry publication does not establish Preview delivery
  docs-preview:
    needs: reconcile
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/docs-preview.yml
    # Without inherited secrets the called job receives an empty website environment token
    secrets: inherit # zizmor: ignore[secrets-inherit]
