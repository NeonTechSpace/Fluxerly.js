name: Release publish
on:
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: Successful Release prepare run ID from this repository
        required: true
        type: string
      candidate_checksum:
        description: Externally reviewed candidate.json SHA256 from the preparation summary
        required: true
        type: string
permissions:
  contents: read
  actions: read
cache-mode: read
# Every job checks out this workflow's own commit, so release tooling never runs from the candidate source.
# The candidate commit is data: It must be reachable from main and becomes the GitHub tag target
jobs:
  inspect:
    name: Inspect the reviewed candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.preparation.outputs.artifactId }}
      source_commit: ${{ steps.preparation.outputs.sourceCommit }}
      version: ${{ steps.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Verify successful preparation and a candidate source reachable from main
        id: preparation
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
        run: node projects/release/github.js preparation
      - name: Download only the verified preparation candidate
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.preparation.outputs.artifactId }}
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
      - name: Inspect exact candidate contents before entering the protected environment
        id: inspect
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
          CANDIDATE_SOURCE_COMMIT: ${{ steps.preparation.outputs.sourceCommit }}
        run: node projects/release/github.js inspect
      - name: Summarize candidate inspection
        if: always()
        uses: $/.github/actions/summary
        with:
          title: Release provenance and candidate inspection
          steps: ${{ toJSON(steps) }}
          checks: '{"Preparation succeeded and its source is on main": "preparation", "Candidate downloaded": "download", "Candidate matches the reviewed checksum": "inspect"}'
          details: >-
            {"Candidate version": ${{ toJSON(steps.inspect.outputs.version) }}, "Reviewed checksum": ${{ toJSON(inputs.candidate_checksum) }}, "Candidate source": ${{ toJSON(steps.preparation.outputs.sourceCommit) }}, "Preparation run ID": ${{ toJSON(inputs.preparation_run_id) }}}
          next: The npm publication job runs next in the protected package environment
          failure: Nothing was published. Check that the preparation run ID and checksum match the Release prepare summary, then start Release publish again
  publish:
    name: Publish npm version
    needs: inspect
    concurrency:
      group: package-release-publish-npm
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: package
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      superseded: ${{ steps.publish.outputs.superseded }}
      superseded_by: ${{ steps.publish.outputs.superseded_by }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      # Publishing a prebuilt tarball needs Node and pnpm, not the workspace dependencies
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Download only the inspected preparation candidate
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.inspect.outputs.artifact_id }}
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
      - name: Reinspect the externally reviewed candidate
        id: inspect
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.inspect.outputs.source_commit }}
        run: node projects/release/github.js inspect
      - name: Publish the npm version, or confirm the reviewed bytes are already published
        id: publish
        working-directory: projects
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
        run: node release/cli.js publish "$CANDIDATE_DIRECTORY" --checksum "$CANDIDATE_CHECKSUM"
      - name: Summarize npm publication
        if: always()
        uses: $/.github/actions/summary
        with:
          title: npm version publication
          steps: ${{ toJSON(steps) }}
          checks: '{"Candidate downloaded": "download", "Candidate reinspected": "inspect", "npm publication": "publish"}'
          details: >-
            {"Candidate version": ${{ toJSON(needs.inspect.outputs.version) }}, "Reviewed checksum": ${{ toJSON(inputs.candidate_checksum) }}, "Candidate source": ${{ toJSON(needs.inspect.outputs.source_commit) }}}
          next: ${{ steps.publish.outputs.superseded == 'true' && format('Superseded by {0}, which has the same content, so nothing was published. The registry install, announcement and docs jobs are skipped', steps.publish.outputs.superseded_by) || 'The registry install checks run next. Rerun this workflow with the same inputs after any failure, publication reads npm before uploading' }}
          failure: The version may or may not be on npm. Rerun this workflow with the same inputs after fixing the cause, because publication reads npm before uploading
  smoke:
    name: ${{ matrix.name }}
    needs: [inspect, publish]
    if: needs.publish.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Registry install on the development Node version
          - name: Registry install on the declared Node floor
            runtime: node@24.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          require-lockfile: true
          cache: true
          runtime: ${{ matrix.runtime }}
      - name: Install the published version from npm and import every public entry point
        id: smoke
        working-directory: projects
        env:
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
        run: node release/smoke.js --version "$RELEASE_VERSION"
      - name: Summarize the registry install check
        if: always()
        uses: $/.github/actions/summary
        with:
          title: ${{ matrix.name }}
          steps: ${{ toJSON(steps) }}
          checks: '{"Published version installs from npm and every public entry point imports": "smoke"}'
          details: '{"Package version": ${{ toJSON(needs.inspect.outputs.version) }}, "Node version": ${{ toJSON(matrix.runtime || ''projects/.node-version'') }}}'
          next: The GitHub release is announced once both registry install checks pass
          failure: The version is on npm but not verified here, so the GitHub release is not announced. Fix the cause and rerun the failed job
          reproduce: |-
            cd projects
            node release/smoke.js --version ${{ needs.inspect.outputs.version }}
  reconcile:
    name: Announce the GitHub release
    needs: [inspect, publish, smoke]
    if: needs.publish.outputs.superseded != 'true'
    concurrency:
      group: package-release-reconcile
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: package
    permissions:
      contents: read
      # Only to start the Website workflow once the release is announced
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Download only the inspected preparation candidate
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.inspect.outputs.artifact_id }}
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-candidate
      - name: Reinspect the externally reviewed candidate before announcement
        id: inspect
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.inspect.outputs.source_commit }}
        run: node projects/release/github.js inspect
      - name: Confirm npm serves the reviewed tarball before requesting the release token
        id: verify
        working-directory: projects
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
        run: node release/cli.js verify "$CANDIDATE_DIRECTORY" --checksum "$CANDIDATE_CHECKSUM"
      - name: Create the repository-scoped release App token
        id: release_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Announce the exact-source GitHub release
        id: announce
        env:
          GH_TOKEN: ${{ steps.release_token.outputs.token }}
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/release-candidate
          CANDIDATE_CHECKSUM: ${{ inputs.candidate_checksum }}
          CANDIDATE_SOURCE_COMMIT: ${{ needs.inspect.outputs.source_commit }}
        run: node projects/release/github.js announce
      - name: Start the website deploy on main
        id: website
        # The release is complete here. Website deploys in its own run, which this one doesn't wait for, so neither a failed
        # deploy nor a failed start fails the release. A dispatch with the job's own token still starts a run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Summarize the GitHub release
        if: always()
        uses: $/.github/actions/summary
        with:
          title: GitHub release reconciliation
          steps: ${{ toJSON(steps) }}
          checks: '{"Candidate reinspected": "inspect", "npm serves the reviewed tarball": "verify", "Release App token created": "release_token", "GitHub release announced": "announce", "Website deploy started on main": "website"}'
          details: >-
            {"Candidate version": ${{ toJSON(needs.inspect.outputs.version) }}, "Tag target": ${{ toJSON(needs.inspect.outputs.source_commit) }}}
          next: The Website workflow deploys main in its own run. Registry publication does not establish website delivery
          failure: When the announcement failed, the npm version is published without its GitHub release. Fix the cause and rerun the failed job, which announces the same candidate. When only the website start failed, the release is complete, so start the Website workflow on main by hand
