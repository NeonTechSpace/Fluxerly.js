name: Upstream drift
on:
  # Monday at midnight local time through daylight saving changes
  schedule:
    - cron: '0 0 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: upstream-drift
  cancel-in-progress: false
  queue: max
jobs:
  drift:
    name: Fluxer API and gateway event drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Read the previous upstream observation
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_dir="$RUNNER_TEMP/upstream-previous"
          mkdir -p "$baseline_dir" "$RUNNER_TEMP/upstream-current"
          fallback() {
            printf '\n### Previous-run baseline\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          if ! default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch' 2>/dev/null) \
            || [[ -z "$default_branch" || "$default_branch" == "null" ]]; then
            fallback "Default branch lookup failed. The repository pin will be used"
            exit 0
          fi
          if ! artifact_runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=upstream-baseline&per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, .id, .workflow_run.id] | @tsv' 2>/dev/null \
            | sort -t $'\t' -k1,1r -k2,2nr); then
            fallback "Artifact lookup failed. The repository pin will be used"
            exit 0
          fi
          while IFS=$'\t' read -r created_at artifact_id run_id; do
            [[ -n "$created_at" ]] || continue
            if [[ ! "$artifact_id" =~ ^[0-9]+$ || ! "$run_id" =~ ^[0-9]+$ ]]; then
              fallback "Artifact metadata has no valid artifact or run ID. The repository pin will be used"
              exit 0
            fi
            [[ "$run_id" != "$GITHUB_RUN_ID" ]] || continue
            # Unit separators keep empty fields in place, and Git forbids control characters in branch names
            if ! run_fields=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq '[.path, .event, .head_branch, .head_repository.full_name, .conclusion] | map(. // "") | join("\u001f")' 2>/dev/null); then
              fallback "Artifact workflow verification failed. The repository pin will be used"
              exit 0
            fi
            IFS=$'\x1f' read -r workflow_path event head_branch head_repository conclusion <<< "$run_fields"
            if [[ -z "$workflow_path" ]]; then
              fallback "Artifact metadata has no workflow path. The repository pin will be used"
              exit 0
            fi
            # Any run of this file can upload an artifact with this name, including a pull request that adds a trigger.
            # Only a successful scheduled or manual run on this repository's default branch sets the baseline
            [[ "$workflow_path" == ".github/workflows/upstream-drift.yml" ]] || continue
            [[ "$event" == "schedule" || "$event" == "workflow_dispatch" ]] || continue
            [[ "$head_branch" == "$default_branch" && "$head_repository" == "$GITHUB_REPOSITORY" ]] || continue
            [[ "$conclusion" == "success" ]] || continue
            # The same run also retained its kept upstream files, which a cache miss restores from
            printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name upstream-baseline --dir "$baseline_dir" 2>/dev/null; then
              rm -f "$baseline_dir/baseline.json"
              fallback "Previous-run artifact download failed. The repository pin will be used"
              exit 0
            fi
            if [[ ! -f "$baseline_dir/baseline.json" ]]; then
              fallback "Previous-run artifact contains no baseline file. The repository pin will be used"
            fi
            exit 0
          done <<< "$artifact_runs"
          fallback "No previous-run artifact is available. The repository pin will be used"
      - name: Restore the kept upstream files
        id: upstream_cache
        # Each file is named by its Git object ID and used only when its bytes hash to the ID that a fresh listing of its
        # folder names, so a kept copy can't change what the comparison reads. Only changed files are downloaded
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/release/.cache/upstream
          key: upstream-source-${{ github.run_id }}
          restore-keys: upstream-source-
      - name: Restore the kept upstream files from the previous reported run
        id: upstream_artifact
        # The cache drops an entry left unused for seven days, which a weekly run can just miss. The run that set the
        # baseline also retained its kept files for 90 days. They are checked like cached copies, so they can't change
        # what the comparison reads, and a failed read only means downloading the watched files again
        if: steps.upstream_cache.outputs.cache-matched-key == '' && steps.baseline.outputs.run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.baseline.outputs.run_id }}
        run: |
          copies=projects/release/.cache/upstream
          mkdir -p "$copies"
          if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name upstream-source --dir "$copies" 2>/dev/null; then
            printf '\n### Kept upstream files\n\n%s\n' "The previous reported run's kept files could not be read. Each watched file is downloaded again" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compare upstream and write the report
        id: drift
        working-directory: projects
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node release/upstream.js --baseline "$RUNNER_TEMP/upstream-previous/baseline.json" --record "$RUNNER_TEMP/upstream-current/baseline.json" --comment "$RUNNER_TEMP/upstream-current/comment.md"
      - name: Save the kept upstream files when they changed
        id: upstream_cache_save
        if: >-
          hashFiles('projects/release/.cache/upstream/*') != '' &&
          steps.upstream_cache.outputs.cache-matched-key != format('upstream-source-{0}', hashFiles('projects/release/.cache/upstream/*'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/release/.cache/upstream
          key: upstream-source-${{ hashFiles('projects/release/.cache/upstream/*') }}
      - name: Hand the report to the posting job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-report
          path: ${{ runner.temp }}/upstream-current
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Retain the kept upstream files for a later cache miss
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-source
          path: projects/release/.cache/upstream
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
  report:
    name: Post the upstream report
    needs: drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job that can write. It runs no repository code and no package setup
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-report
          path: ${{ runner.temp }}/upstream-current
      # The report goes to the open issue this workflow opened, as the GitHub Actions bot. With none open, it opens one
      # that explains itself, so closing a reviewed issue starts the next one fresh
      - name: Post to the drift issue
        id: post
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Fluxer upstream changes to review
        run: |
          comment="$RUNNER_TEMP/upstream-current/comment.md"
          [[ -f "$comment" ]] || exit 0
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
            --jq '[.[] | select(.pull_request == null and .title == $ENV.TITLE)][0].number // empty')
          if [[ -n "$issue" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --silent -F "body=@$comment"
            exit 0
          fi
          body="$RUNNER_TEMP/upstream-current/issue.md"
          repository="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            printf 'This issue collects the reports of the weekly [upstream drift check](%s/actions/workflows/upstream-drift.yml). Each report lists what changed in Fluxer since the last one: its API description, its gateway event docs, its rate limit docs, its voice docs and code, new folders that may hold voice work and the Fluxer commits that touched the paths the SDK watches\n\n' "$repository"
            printf 'A listed change is something to review, not proof that bots are affected. To finish a review, update the SDK where needed and move the review pin as [Repository](%s/blob/main/docs/REPOSITORY.md) describes for `node release/upstream.js`, then close this issue. The next report opens a new one\n\n' "$repository"
            cat "$comment"
          } > "$body"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues" --silent -f "title=$TITLE" -F "body=@$body"
      # Only now does the observation become the next run's baseline, so a failed post repeats instead of losing changes
      - name: Retain the reported upstream observation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-baseline
          path: ${{ runner.temp }}/upstream-current/baseline.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
