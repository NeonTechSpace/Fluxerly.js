name: Website
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
cache-mode: read
concurrency:
  group: website
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: website
      url: https://fluxerly.neontechspace.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          require-lockfile: true
          cache: true
      - name: Restore the kept release snapshots
        id: release_snapshots_cache
        # Restore only, so this workflow still never saves a cache. The import uses a kept copy only when it matches the
        # digest and size in the fresh release metadata, and downloads the asset again otherwise. CI's Check workflow saves
        # this cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/web/.cache/releases
          key: release-snapshots-${{ github.sha }}
          restore-keys: release-snapshots-
      - name: Read verified release snapshots
        id: snapshots
        run: node web/scripts/fetch-releases.js
        working-directory: projects
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the SDK declarations for the checks
        id: build
        run: pnpm --filter @neontechspace/fluxerly build
        working-directory: projects
      - name: Refresh the download counts for this deploy
        # npm being down shouldn't stop a release, so the site then keeps the counts it has
        continue-on-error: true
        run: pnpm --filter fluxerly-docs downloads:fetch
        working-directory: projects
      - name: Restore Fluxer's pinned OpenAPI document and docs source
        id: fluxer_source_cache
        # Restore only, so this workflow still never saves a cache. A cache entry can't change what gets built: the
        # endpoint map checks every file, cached or downloaded, against the sha256 that this checkout's
        # projects/release/upstream/manifest.json pins, and downloads again any file that differs. A tampered or stale
        # entry costs one download, never different content. CI's Check workflow saves this cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/web/.cache/fluxer
          key: fluxer-source-${{ hashFiles('projects/release/upstream/manifest.json') }}
      - name: Build and check the public site from the published versions
        id: workspace
        env:
          CHECK_RESULTS_FILE: ${{ runner.temp }}/public-checks.json
        run: pnpm --filter fluxerly-docs check:public
        working-directory: projects
      - name: Read the locked Playwright version
        id: playwright
        run: printf 'version=%s\n' "$(node --print 'require("./web/node_modules/playwright/package.json").version')" >> "$GITHUB_OUTPUT"
        working-directory: projects
      - name: Restore Playwright browsers
        id: browser_cache
        # Restore only, so this workflow still never saves a cache. CI's Check workflow saves this cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install browser and system dependencies
        id: browser_install
        env:
          BROWSER_CACHED: ${{ steps.browser_cache.outputs.cache-hit }}
        run: |
          if [ "$BROWSER_CACHED" = true ]; then
            pnpm --filter fluxerly-docs exec playwright install-deps chromium
          else
            pnpm --filter fluxerly-docs exec playwright install --with-deps chromium
          fi
        working-directory: projects
      - name: Check every screen of the site about to be deployed
        id: browser
        # The only full screen check. CI tests just the screens a change reaches
        run: pnpm --filter fluxerly-docs test:browser
        working-directory: projects
      - name: Require successful Check for the exact checkout
        id: ci
        run: node web/scripts/checked-source.js
        working-directory: projects
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Record the checked source
        id: source
        shell: bash
        run: |
          source="$(git rev-parse HEAD)"
          if [ "$source" != "$CHECKED_SOURCE" ]; then
            printf 'Checkout changed after CI verification\n' >&2
            exit 1
          fi
          printf 'DOCS_SOURCE_COMMIT=%s\n' "$source" >> "$GITHUB_ENV"
          printf '{"sourceCommit":"%s"}\n' "$source" > projects/web/dist/deployment.json
        env:
          CHECKED_SOURCE: ${{ steps.ci.outputs.source_commit }}
      - name: Deploy to the site's address and verify it
        id: deploy
        run: node scripts/deploy.js
        working-directory: projects/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Summarize website delivery
        if: always()
        uses: $/.github/actions/summary
        with:
          title: Website delivery
          steps: ${{ toJSON(steps) }}
          checks: '{"Release snapshots verified": "snapshots", "SDK declarations build": "build", "Public site build and checks": "workspace", "Check passed for this source": "ci", "Checked source recorded": "source", "Deploy and verification": "deploy"}'
          results: '{"workspace": "${{ runner.temp }}/public-checks.json"}'
          details: >-
            {"Checked source commit": ${{ toJSON(env.DOCS_SOURCE_COMMIT) }}, "Reused Check run": ${{ toJSON(steps.ci.outputs.run_url) }}, "Exact deployment URL": ${{ toJSON(steps.deploy.outputs.deployment_url) }}, "Custom-domain access": ${{ toJSON(steps.deploy.outputs.custom_domain_status == 'verified' && 'Verified' || steps.deploy.outputs.custom_domain_status == 'challenged' && 'Cloudflare challenge, public access not verified' || 'Unconfirmed, inspect deployment verification') }}}
          next: Open https://fluxerly.neontechspace.com to look at the deployed site
          failure: The live site changes only when the deploy step passes. Fix the failed step and run Website again
          reproduce: |-
            cd projects
            pnpm --filter fluxerly-docs check:public
