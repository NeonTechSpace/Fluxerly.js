name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  # Identical git trees need one full Check, so a run for content that already passed reuses that result
  reuse:
    name: Reuse a passing Check for identical content
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      run_url: ${{ steps.reuse.outputs.run_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Find an earlier passing Check for the same git tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node projects/release/reuse.js
  sdk:
    name: SDK checks
    needs: reuse
    # A failed reuse lookup still runs the full job
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          require-lockfile: true
          cache: true
      - name: Check SDK formatting, build, types, runtime and packed consumers
        id: sdk
        run: pnpm --filter @neontechspace/fluxerly check
        working-directory: projects
      - name: Summarize SDK checks
        if: always()
        uses: $/.github/actions/summary
        with:
          title: SDK checks
          steps: ${{ toJSON(steps) }}
          next: Check the other jobs too. The check job combines every required result
  tooling:
    name: Website and release tooling checks
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          require-lockfile: true
          cache: true
      - name: Build the SDK declarations for the documentation reference
        id: build
        run: pnpm --filter @neontechspace/fluxerly build
        working-directory: projects
      - name: Restore Fluxer's pinned OpenAPI document and docs source
        id: fluxer_source_cache
        # Saved here and only restored by the release and website workflows, which never save caches. The endpoint map
        # checks every file against the hash in projects/release/upstream/manifest.json, so the key only saves downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/web/.cache/fluxer
          key: fluxer-source-${{ hashFiles('projects/release/upstream/manifest.json') }}
      - name: Check release tooling, contribution forms and the documentation website side by side
        id: website
        # Each check starts once the checks it reads from have passed, and the log names every result with its time
        run: node scripts/check.mjs release contributions web
        working-directory: projects
      - name: Summarize website and release tooling checks
        if: always()
        uses: $/.github/actions/summary
        with:
          title: Website and release tooling checks
          steps: ${{ toJSON(steps) }}
          next: Check the other jobs too. The check job combines every required result
  workflows:
    name: Workflow lint and security audit
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Restore the kept actionlint release
        id: actionlint_cache
        # Keyed by the pinned release and its checksum. The lint step checks the kept archive against that checksum before
        # each use, so an entry can't change what runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint
          key: actionlint-1.7.12-linux-amd64-8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      - name: Lint workflow syntax, expressions and shell scripts
        id: actionlint
        # The allowed-actions policy accepts no container images, so the pinned release binary is verified by its checksum.
        # An absent or damaged kept archive is downloaded again and checked the same way
        run: |
          archive="$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz"
          checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive"
          if ! echo "$checksum" | sha256sum --check --strict --status 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/actionlint"
            curl --fail --silent --show-error --location --output "$archive" \
              https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
            echo "$checksum" | sha256sum --check --strict
          fi
          tar --extract --gzip --file "$archive" actionlint
          ./actionlint -color
      - name: Restore the kept zizmor download
        id: zizmor_cache
        # The action downloads zizmor's wheel through pip, which reuses a response it already holds. pip checks the wheel
        # against the hashes the action pins for this version, so an entry can't change what runs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: zizmor-pip-${{ runner.os }}-1.30.1
      - name: Audit workflow security
        id: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
      - name: Summarize workflow checks
        if: always()
        uses: $/.github/actions/summary
        with:
          title: Workflow lint and security audit
          steps: ${{ toJSON(steps) }}
          next: Fix reported findings in the workflow source rather than suppressing them
  browser:
    name: Documentation browser checks
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          require-lockfile: true
          cache: true
      - name: Restore Fluxer's pinned OpenAPI document and docs source
        id: fluxer_source_cache
        # Saved here and only restored by the release and website workflows, which never save caches. The endpoint map
        # checks every file against the hash in projects/release/upstream/manifest.json, so the key only saves downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/web/.cache/fluxer
          key: fluxer-source-${{ hashFiles('projects/release/upstream/manifest.json') }}
      - name: Build the SDK and documentation
        id: build
        run: pnpm build
        working-directory: projects
      - name: Read the locked Playwright version
        id: playwright
        run: printf 'version=%s\n' "$(node --print 'require("./web/node_modules/playwright/package.json").version')" >> "$GITHUB_OUTPUT"
        working-directory: projects
      - name: Restore Playwright browsers
        id: browser_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install browser and system dependencies
        id: browser_install
        env:
          BROWSER_CACHED: ${{ steps.browser_cache.outputs.cache-hit }}
        run: |
          if [ "$BROWSER_CACHED" = true ]; then
            pnpm --filter fluxerly-docs exec playwright install-deps chromium
          else
            pnpm --filter fluxerly-docs exec playwright install --with-deps chromium
          fi
        working-directory: projects
      - name: Detect a Stable version that npm does not have yet
        id: stable
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER_SHA: ${{ github.sha }}
        run: node projects/release/github.js stable-pending
      - name: Restore the kept release snapshots
        id: release_snapshots_cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/web/.cache/releases
          key: release-snapshots-${{ github.sha }}
          restore-keys: release-snapshots-
      - name: Keep a copy of each release snapshot the website imports
        id: release_snapshots
        # The website workflow restores these copies and checks each against the fresh release metadata, so a deploy
        # downloads only snapshots published since. A failed read here costs that deploy the downloads, not this Check
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node web/scripts/fetch-releases.js --cache-only
        working-directory: projects
      - name: Save the release snapshots when they changed
        id: release_snapshots_save
        if: >-
          github.event_name == 'push' && steps.release_snapshots.outcome == 'success' &&
          hashFiles('projects/web/.cache/releases/*.json') != '' &&
          steps.release_snapshots_cache.outputs.cache-matched-key != format('release-snapshots-{0}', hashFiles('projects/web/.cache/releases/*.json'))
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: projects/web/.cache/releases
          key: release-snapshots-${{ hashFiles('projects/web/.cache/releases/*.json') }}
      - name: Check documentation in a browser
        id: browser
        env:
          # Pull requests and ordinary pushes test a few screens of each kind. A manual run, a Stable's version branch and any
          # push while a Stable isn't on npm yet test them all, and so does a push whose version lookup failed
          ALL_SCREENS: ${{ github.event_name != 'pull_request' && steps.stable.outputs.pending != 'false' }}
        run: |
          if [ "$ALL_SCREENS" = true ]; then
            pnpm --filter fluxerly-docs test:browser
          else
            pnpm --filter fluxerly-docs test:browser --quick
          fi
          pnpm --filter fluxerly-docs test:versions
        working-directory: projects
      - name: Summarize browser checks
        if: always()
        uses: $/.github/actions/summary
        with:
          title: Documentation browser checks
          steps: ${{ toJSON(steps) }}
          next: Live sandbox checks remain opt-in and separate from CI
  consumers:
    name: ${{ matrix.name }}
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: SDK consumers on the development Node version
          - name: SDK consumers on the declared Node floor
            runtime: node@24.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          require-lockfile: true
          cache: true
          runtime: ${{ matrix.runtime }}
      - name: Build the SDK on the selected Node version
        id: build
        run: pnpm --filter @neontechspace/fluxerly build
        working-directory: projects
      # The sdk job runs the suite on the development Node version, so this covers the declared engines floor
      - name: Run the SDK test suite on the declared Node floor
        id: test
        if: matrix.runtime
        run: pnpm --filter @neontechspace/fluxerly test
        working-directory: projects
      # The sdk job's check runs the example bots' tests on the development Node version
      - name: Run the example bots' tests on the declared Node floor
        id: examples
        if: matrix.runtime
        run: pnpm --filter @neontechspace/fluxerly test:examples
        working-directory: projects
      # The sdk job's check already packs and runs these consumers on the development Node version
      - name: Check packed JavaScript and TypeScript consumers on the declared Node floor
        id: package
        if: matrix.runtime
        run: pnpm --filter @neontechspace/fluxerly test:package
        working-directory: projects
      - name: Check npm-installed consumers
        id: npm
        run: pnpm --filter @neontechspace/fluxerly test:npm
        working-directory: projects
      - name: Summarize consumer compatibility
        if: always()
        uses: $/.github/actions/summary
        with:
          title: ${{ matrix.name }}
          steps: ${{ toJSON(steps) }}
          details: '{"Node version": ${{ toJSON(matrix.runtime || ''projects/.node-version'') }}}'
          next: Both the development and Node floor jobs must pass before merging
  check:
    name: check
    needs: [reuse, sdk, tooling, workflows, browser, consumers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize required checks and enforce the result
        shell: bash
        env:
          REUSE_RESULT: ${{ needs.reuse.result }}
          REUSED_RUN_URL: ${{ needs.reuse.outputs.run_url }}
          SDK_RESULT: ${{ needs.sdk.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
        run: |
          if [ "$REUSE_RESULT" = success ] && [ -n "$REUSED_RUN_URL" ]; then
            printf '## Required checks\n\nReused %s, which passed for identical content. The check jobs did not run again\n' "$REUSED_RUN_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          printf '## Required checks\n\n| Check group | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for group in SDK TOOLING WORKFLOWS BROWSER CONSUMERS; do
            variable="${group}_RESULT"
            result="${!variable}"
            printf '| %s | %s |\n' "$group" "$result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != success ]; then status=1; fi
          done
          if [ "$status" -eq 0 ]; then
            printf '\nAll required CI groups passed, including both Node consumer versions\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nRequired checks did not all pass. Inspect failed, cancelled or skipped jobs before merging\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nCI does not publish packages or verify live sandbox behavior\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
  release-trigger:
    name: Release preparation trigger
    needs: check
    # The default condition skips this job when a reused Check skipped the jobs behind check, so it reads check's result
    if: ${{ !cancelled() && needs.check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        id: setup
        with:
          working-directory: projects
          install: false
      - name: Detect a pushed SDK version that npm does not have
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node projects/release/github.js prepare-trigger
      - name: Dispatch Release prepare for the pushed source
        id: dispatch
        if: steps.trigger.outputs.prepare == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: gh workflow run release-prepare.yml --repo "$GITHUB_REPOSITORY" --ref main -f source_ref="$SOURCE_COMMIT"
      - name: Summarize the release preparation trigger
        if: always()
        uses: $/.github/actions/summary
        with:
          title: Release preparation trigger
          steps: ${{ toJSON(steps) }}
          details: >-
            {"SDK version": ${{ toJSON(steps.trigger.outputs.version) }}, "Release prepare dispatched": ${{ toJSON(steps.trigger.outputs.prepare) }}}
          next: When dispatched, review the Release prepare run summary before publishing
